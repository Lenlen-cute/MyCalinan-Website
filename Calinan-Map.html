<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Services | MyCalinan</title>
  <link rel="icon" type="image/png" href="image/CALINAN LOGO.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

  <style>
    :root {
      --green-900: #1f4d33;
      --green-800: #2b6b45;
      --green-700: #3c8a5d;
      --green-600: #5aa77a;
      --green-soft: #eaf6ef;
      --bg: #f7faf8;
      --white: #fff;
      --text-main: #1e2a23;
      --text-muted: #5a6b61;
      --red: #d9534f;
      --shadow: 0 8px 24px rgba(0,0,0,0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", "Poppins", Arial, sans-serif; }
    body { background: var(--bg); color: var(--text-main); }

    /* ── NAVBAR (matches homepage) ── */
    .navbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 14px 40px;
      background: #368659;
      border-bottom: 1px solid #2f7450;
      position: sticky; top: 0; z-index: 2000;
    }
    .nav-back { justify-self: start; }
    .nav-back a {
      color: white; text-decoration: none; font-weight: 600;
      font-size: 14px; display: flex; align-items: center; gap: 6px;
    }
    .nav-back a:hover { opacity: 0.8; }
    .nav-title {
      justify-self: center;
      color: white; font-size: 22px; font-weight: 800;
      font-family: "Times New Roman", serif; letter-spacing: 1px;
    }

    /* ── SEARCH BAR ── */
    .search-bar-wrap {
      background: white;
      border-bottom: 1px solid #e0ece5;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .search-bar-wrap input {
      flex: 1; min-width: 220px; max-width: 480px;
      padding: 11px 18px;
      border-radius: 30px;
      border: 1.5px solid #c8dfd0;
      font-size: 14px; outline: none;
      transition: border 0.2s;
    }
    .search-bar-wrap input:focus { border-color: var(--green-600); }
    .search-bar-wrap button {
      padding: 11px 22px; border: none; border-radius: 30px;
      background: var(--green-800); color: white;
      font-weight: 600; cursor: pointer; font-size: 14px;
      transition: background 0.2s;
    }
    .search-bar-wrap button:hover { background: var(--green-900); }

    /* ── CATEGORY PILLS ── */
    .categories {
      display: flex; justify-content: center; flex-wrap: wrap;
      gap: 8px; padding: 14px 20px;
      background: var(--green-soft);
      border-bottom: 1px solid #d4ead9;
    }
    .cat-btn {
      border: 1.5px solid var(--green-700);
      padding: 8px 16px; border-radius: 30px;
      background: white; color: var(--green-800);
      cursor: pointer; font-size: 13px; font-weight: 600;
      transition: all 0.2s;
    }
    .cat-btn:hover, .cat-btn.active {
      background: var(--green-800); color: white;
      border-color: var(--green-800);
    }

    /* ── MAP CONTAINER ── */
    #map {
      height: 520px; width: 100%;
      border-bottom: 3px solid var(--green-700);
    }

    /* ── INFO PANEL ── */
    .info-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      padding: 24px 28px;
      max-width: 1300px;
      margin: 0 auto;
    }

    .card {
      background: white; padding: 20px; border-radius: 16px;
      box-shadow: var(--shadow); border: 1px solid #e6f1ea;
    }
    .card h3 {
      color: var(--green-800); font-size: 16px;
      font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .card h3 span { font-size: 18px; }

    /* GPS card */
    .gps-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .gps-label { font-size: 13px; color: var(--text-muted); }
    .gps-val { font-weight: 700; font-size: 14px; color: var(--green-900); }
    .gps-status {
      display: inline-block; margin-top: 10px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .gps-status.ok { background: #d4f5e2; color: #1f7a45; }
    .gps-status.waiting { background: #fff3cd; color: #856404; }
    .gps-status.denied { background: #fde8e8; color: #a32222; }

    /* Nearby list */
    .nearby-list { list-style: none; }
    .nearby-list li {
      padding: 9px 0; border-bottom: 1px solid #eef4f0;
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; cursor: pointer;
      transition: color 0.15s;
    }
    .nearby-list li:hover { color: var(--green-700); }
    .nearby-list li:last-child { border-bottom: none; }
    .nearby-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-600); flex-shrink: 0; }

    /* Route card */
    .route-select {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid #c8dfd0; font-size: 14px;
      margin-bottom: 10px; outline: none;
    }
    .route-select:focus { border-color: var(--green-600); }
    .route-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: var(--green-800); color: white;
      font-weight: 700; font-size: 14px; cursor: pointer;
      transition: background 0.2s; margin-bottom: 8px;
    }
    .route-btn:hover { background: var(--green-900); }
    .clear-btn {
      width: 100%; padding: 10px; border: 1.5px solid #ccc;
      border-radius: 10px; background: white; color: var(--text-muted);
      font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .clear-btn:hover { border-color: var(--red); color: var(--red); }

    /* Emergency */
    .emerg-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      color: white; font-weight: 700; font-size: 14px;
      cursor: pointer; margin-bottom: 8px; transition: opacity 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .emerg-btn:hover { opacity: 0.88; }
    .emerg-hospital { background: #d9534f; }
    .emerg-police   { background: #2b4d8c; }
    .emerg-fire     { background: #e07b39; }

    /* Search results overlay */
    #search-results {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      z-index: 3000; background: white; border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.14);
      width: 460px; max-width: 92vw;
      max-height: 320px; overflow-y: auto;
      display: none;
      border: 1px solid #ddeee4;
    }
    #search-results .sr-item {
      padding: 13px 18px; border-bottom: 1px solid #f0f7f2;
      cursor: pointer; font-size: 14px;
      display: flex; gap: 10px; align-items: flex-start;
      transition: background 0.15s;
    }
    #search-results .sr-item:hover { background: var(--green-soft); }
    #search-results .sr-item:last-child { border-bottom: none; }
    .sr-icon { font-size: 18px; flex-shrink: 0; }
    .sr-name { font-weight: 600; color: var(--green-900); }
    .sr-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Loading spinner inside search */
    .sr-loading { padding: 18px; text-align: center; color: var(--text-muted); font-size: 14px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: var(--green-900); color: white;
      padding: 12px 24px; border-radius: 30px;
      font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s; z-index: 9999;
    }
    #toast.show { opacity: 1; }

    /* Popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 12px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important;
    }
    .popup-content h4 { color: var(--green-800); margin-bottom: 6px; font-size: 15px; }
    .popup-content p { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
    .popup-content button {
      padding: 7px 14px; border: none; border-radius: 8px;
      background: var(--green-700); color: white;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .popup-content button:hover { background: var(--green-900); }

    /* Search wrap position context */
    .search-bar-wrap { position: relative; }

    /* Responsive */
    @media (max-width: 600px) {
      #map { height: 380px; }
      .info-panel { padding: 16px; gap: 14px; }
      .navbar { padding: 12px 16px; }
      .nav-title { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-back">
      <a href="HomePage.html">← MyCalinan</a>
    </div>
    <div class="nav-title">Map Services</div>
    <div></div>
  </nav>

  <!-- SEARCH -->
  <div class="search-bar-wrap" id="searchWrap">
    <input type="text" id="searchInput" placeholder="Search tourist spots, hospitals, schools…" autocomplete="off">
    <button onclick="doSearch()">Search</button>
    <div id="search-results"></div>
  </div>

  <!-- CATEGORY FILTERS -->
  <div class="categories">
    <button class="cat-btn active" onclick="filterCat(this,'all')">All</button>
    <button class="cat-btn" onclick="filterCat(this,'tourist')">Tourist Spots</button>
    <button class="cat-btn" onclick="filterCat(this,'hospital')">Hospitals</button>
    <button class="cat-btn" onclick="filterCat(this,'school')">Schools</button>
    <button class="cat-btn" onclick="filterCat(this,'restaurant')">Restaurants</button>
    <button class="cat-btn" onclick="filterCat(this,'police')">Police Stations</button>
    <button class="cat-btn" onclick="filterCat(this,'government')">Government</button>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- INFO PANEL -->
  <div class="info-panel">

    <!-- GPS -->
    <div class="card">
      <h3><span>📍</span> Your Location</h3>
      <div class="gps-row"><span class="gps-label">Latitude</span><span class="gps-val" id="lat">—</span></div>
      <div class="gps-row"><span class="gps-label">Longitude</span><span class="gps-val" id="lng">—</span></div>
      <div class="gps-row"><span class="gps-label">Accuracy</span><span class="gps-val" id="acc">—</span></div>
      <span class="gps-status waiting" id="gps-status">Waiting for GPS…</span>
      <br><br>
      <button class="route-btn" onclick="recenterMap()" style="margin-bottom:0">📍 Re-center to My Location</button>
    </div>

    <!-- Nearby -->
    <div class="card">
      <h3><span>🗺️</span> Nearby Places</h3>
      <ul class="nearby-list" id="nearbyList">
        <li><span class="nearby-dot"></span>Loading nearby places…</li>
      </ul>
    </div>

    <!-- Route -->
    <div class="card">
      <h3><span>🧭</span> Route Planning</h3>
      <select class="route-select" id="routeSelect">
        <option value="">— Choose a destination —</option>
      </select>
      <button class="route-btn" onclick="getDirections()">Get Directions</button>
      <button class="clear-btn" onclick="clearRoute()">✕ Clear Route</button>
    </div>

    <!-- Emergency -->
    <div class="card">
      <h3><span>🚨</span> Emergency Services</h3>
      <button class="emerg-btn emerg-hospital" onclick="findNearest('hospital')">🏥 Nearest Hospital</button>
      <button class="emerg-btn emerg-police"   onclick="findNearest('police')">🚔 Nearest Police Station</button>
      <button class="emerg-btn emerg-fire"     onclick="findNearest('fire')">🚒 Nearest Fire Station</button>
    </div>

  </div>

  <!-- TOAST -->
  <div id="toast"></div>
</body>
</html>
