<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Services | MyCalinan</title>
  <link rel="icon" type="image/png" href="image/CALINAN LOGO.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

  <style>
    :root {
      --green-900: #1f4d33;
      --green-800: #2b6b45;
      --green-700: #3c8a5d;
      --green-600: #5aa77a;
      --green-soft: #eaf6ef;
      --bg: #f7faf8;
      --white: #fff;
      --text-main: #1e2a23;
      --text-muted: #5a6b61;
      --red: #d9534f;
      --shadow: 0 8px 24px rgba(0,0,0,0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", "Poppins", Arial, sans-serif; }
    body { background: var(--bg); color: var(--text-main); }

    /* ── NAVBAR (matches homepage) ── */
    .navbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 14px 40px;
      background: #368659;
      border-bottom: 1px solid #2f7450;
      position: sticky; top: 0; z-index: 2000;
    }
    .nav-back { justify-self: start; }
    .nav-back a {
      color: white; text-decoration: none; font-weight: 600;
      font-size: 14px; display: flex; align-items: center; gap: 6px;
    }
    .nav-back a:hover { opacity: 0.8; }
    .nav-title {
      justify-self: center;
      color: white; font-size: 22px; font-weight: 800;
      font-family: "Times New Roman", serif; letter-spacing: 1px;
    }

    /* ── SEARCH BAR ── */
    .search-bar-wrap {
      background: white;
      border-bottom: 1px solid #e0ece5;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .search-bar-wrap input {
      flex: 1; min-width: 220px; max-width: 480px;
      padding: 11px 18px;
      border-radius: 30px;
      border: 1.5px solid #c8dfd0;
      font-size: 14px; outline: none;
      transition: border 0.2s;
    }
    .search-bar-wrap input:focus { border-color: var(--green-600); }
    .search-bar-wrap button {
      padding: 11px 22px; border: none; border-radius: 30px;
      background: var(--green-800); color: white;
      font-weight: 600; cursor: pointer; font-size: 14px;
      transition: background 0.2s;
    }
    .search-bar-wrap button:hover { background: var(--green-900); }

    /* ── CATEGORY PILLS ── */
    .categories {
      display: flex; justify-content: center; flex-wrap: wrap;
      gap: 8px; padding: 14px 20px;
      background: var(--green-soft);
      border-bottom: 1px solid #d4ead9;
    }
    .cat-btn {
      border: 1.5px solid var(--green-700);
      padding: 8px 16px; border-radius: 30px;
      background: white; color: var(--green-800);
      cursor: pointer; font-size: 13px; font-weight: 600;
      transition: all 0.2s;
    }
    .cat-btn:hover, .cat-btn.active {
      background: var(--green-800); color: white;
      border-color: var(--green-800);
    }

    /* ── MAP CONTAINER ── */
    #map {
      height: 520px; width: 100%;
      border-bottom: 3px solid var(--green-700);
    }

    /* ── INFO PANEL ── */
    .info-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      padding: 24px 28px;
      max-width: 1300px;
      margin: 0 auto;
    }

    .card {
      background: white; padding: 20px; border-radius: 16px;
      box-shadow: var(--shadow); border: 1px solid #e6f1ea;
    }
    .card h3 {
      color: var(--green-800); font-size: 16px;
      font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .card h3 span { font-size: 18px; }

    /* GPS card */
    .gps-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .gps-label { font-size: 13px; color: var(--text-muted); }
    .gps-val { font-weight: 700; font-size: 14px; color: var(--green-900); }
    .gps-status {
      display: inline-block; margin-top: 10px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .gps-status.ok { background: #d4f5e2; color: #1f7a45; }
    .gps-status.waiting { background: #fff3cd; color: #856404; }
    .gps-status.denied { background: #fde8e8; color: #a32222; }

    /* Nearby list */
    .nearby-list { list-style: none; }
    .nearby-list li {
      padding: 9px 0; border-bottom: 1px solid #eef4f0;
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; cursor: pointer;
      transition: color 0.15s;
    }
    .nearby-list li:hover { color: var(--green-700); }
    .nearby-list li:last-child { border-bottom: none; }
    .nearby-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-600); flex-shrink: 0; }

    /* Route card */
    .route-select {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid #c8dfd0; font-size: 14px;
      margin-bottom: 10px; outline: none;
    }
    .route-select:focus { border-color: var(--green-600); }
    .route-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: var(--green-800); color: white;
      font-weight: 700; font-size: 14px; cursor: pointer;
      transition: background 0.2s; margin-bottom: 8px;
    }
    .route-btn:hover { background: var(--green-900); }
    .clear-btn {
      width: 100%; padding: 10px; border: 1.5px solid #ccc;
      border-radius: 10px; background: white; color: var(--text-muted);
      font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .clear-btn:hover { border-color: var(--red); color: var(--red); }

    /* Emergency */
    .emerg-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      color: white; font-weight: 700; font-size: 14px;
      cursor: pointer; margin-bottom: 8px; transition: opacity 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .emerg-btn:hover { opacity: 0.88; }
    .emerg-hospital { background: #d9534f; }
    .emerg-police   { background: #2b4d8c; }
    .emerg-fire     { background: #e07b39; }

    /* Search results overlay */
    #search-results {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      z-index: 3000; background: white; border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.14);
      width: 460px; max-width: 92vw;
      max-height: 320px; overflow-y: auto;
      display: none;
      border: 1px solid #ddeee4;
    }
    #search-results .sr-item {
      padding: 13px 18px; border-bottom: 1px solid #f0f7f2;
      cursor: pointer; font-size: 14px;
      display: flex; gap: 10px; align-items: flex-start;
      transition: background 0.15s;
    }
    #search-results .sr-item:hover { background: var(--green-soft); }
    #search-results .sr-item:last-child { border-bottom: none; }
    .sr-icon { font-size: 18px; flex-shrink: 0; }
    .sr-name { font-weight: 600; color: var(--green-900); }
    .sr-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Loading spinner inside search */
    .sr-loading { padding: 18px; text-align: center; color: var(--text-muted); font-size: 14px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: var(--green-900); color: white;
      padding: 12px 24px; border-radius: 30px;
      font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s; z-index: 9999;
    }
    #toast.show { opacity: 1; }

    /* Popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 12px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important;
    }
    .popup-content h4 { color: var(--green-800); margin-bottom: 6px; font-size: 15px; }
    .popup-content p { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
    .popup-content button {
      padding: 7px 14px; border: none; border-radius: 8px;
      background: var(--green-700); color: white;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .popup-content button:hover { background: var(--green-900); }

    /* Search wrap position context */
    .search-bar-wrap { position: relative; }

    /* Responsive */
    @media (max-width: 600px) {
      #map { height: 380px; }
      .info-panel { padding: 16px; gap: 14px; }
      .navbar { padding: 12px 16px; }
      .nav-title { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-back">
      <a href="HomePage.html">← MyCalinan</a>
    </div>
    <div class="nav-title">Map Services</div>
    <div></div>
  </nav>

  <!-- SEARCH -->
  <div class="search-bar-wrap" id="searchWrap">
    <input type="text" id="searchInput" placeholder="Search tourist spots, hospitals, schools…" autocomplete="off">
    <button onclick="doSearch()">Search</button>
    <div id="search-results"></div>
  </div>

  <!-- CATEGORY FILTERS -->
  <div class="categories">
    <button class="cat-btn active" onclick="filterCat(this,'all')">All</button>
    <button class="cat-btn" onclick="filterCat(this,'tourist')">Tourist Spots</button>
    <button class="cat-btn" onclick="filterCat(this,'hospital')">Hospitals</button>
    <button class="cat-btn" onclick="filterCat(this,'school')">Schools</button>
    <button class="cat-btn" onclick="filterCat(this,'restaurant')">Restaurants</button>
    <button class="cat-btn" onclick="filterCat(this,'police')">Police Stations</button>
    <button class="cat-btn" onclick="filterCat(this,'government')">Government</button>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- INFO PANEL -->
  <div class="info-panel">

    <!-- GPS -->
    <div class="card">
      <h3><span>📍</span> Your Location</h3>
      <div class="gps-row"><span class="gps-label">Latitude</span><span class="gps-val" id="lat">—</span></div>
      <div class="gps-row"><span class="gps-label">Longitude</span><span class="gps-val" id="lng">—</span></div>
      <div class="gps-row"><span class="gps-label">Accuracy</span><span class="gps-val" id="acc">—</span></div>
      <span class="gps-status waiting" id="gps-status">Waiting for GPS…</span>
      <br><br>
      <button class="route-btn" onclick="recenterMap()" style="margin-bottom:0">📍 Re-center to My Location</button>
    </div>

    <!-- Nearby -->
    <div class="card">
      <h3><span>🗺️</span> Nearby Places</h3>
      <ul class="nearby-list" id="nearbyList">
        <li><span class="nearby-dot"></span>Loading nearby places…</li>
      </ul>
    </div>

    <!-- Route -->
    <div class="card">
      <h3><span>🧭</span> Route Planning</h3>
      <select class="route-select" id="routeSelect">
        <option value="">— Choose a destination —</option>
      </select>
      <button class="route-btn" onclick="getDirections()">Get Directions</button>
      <button class="clear-btn" onclick="clearRoute()">✕ Clear Route</button>
    </div>

    <!-- Emergency -->
    <div class="card">
      <h3><span>🚨</span> Emergency Services</h3>
      <button class="emerg-btn emerg-hospital" onclick="findNearest('hospital')">🏥 Nearest Hospital</button>
      <button class="emerg-btn emerg-police"   onclick="findNearest('police')">🚔 Nearest Police Station</button>
      <button class="emerg-btn emerg-fire"     onclick="findNearest('fire')">🚒 Nearest Fire Station</button>
    </div>

  </div>

  <!-- TOAST -->
  <div id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────
const API = 'http://localhost:5000/api';

// ─── PLACE DATA ───────────────────────────────────────
// Fallback static data when Flask is offline; replace/extend via API
const STATIC_PLACES = [
  { id:1,  name:'Philippine Eagle Center',      cat:'tourist',    lat:7.1860, lng:125.4550, desc:'World-class eagle sanctuary and conservation center.', icon:'🦅' },
  { id:2,  name:'Malagos Garden Resort',        cat:'tourist',    lat:7.1750, lng:125.4300, desc:'Eco-resort with gardens, animals, and chocolate farm.',  icon:'🌿' },
  { id:3,  name:'Davao Bamboo Sanctuary',       cat:'tourist',    lat:7.1920, lng:125.4620, desc:'Ecological park showcasing native bamboo species.',       icon:'🎋' },
  { id:4,  name:'Calinan Public Market',        cat:'restaurant', lat:7.1885, lng:125.4558, desc:'Central market with fresh produce and local food.',        icon:'🛒' },
  { id:5,  name:'Calinan District Hospital',    cat:'hospital',   lat:7.1870, lng:125.4530, desc:'Government hospital serving Calinan district.',           icon:'🏥' },
  { id:6,  name:'Calinan Police Station',       cat:'police',     lat:7.1895, lng:125.4570, desc:'PNP Station 10 — Calinan.',                               icon:'🚔' },
  { id:7,  name:'Calinan National High School', cat:'school',     lat:7.1910, lng:125.4540, desc:'Public high school in Calinan Poblacion.',                icon:'🏫' },
  { id:8,  name:'Barangay Hall Calinan',        cat:'government', lat:7.1880, lng:125.4560, desc:'Barangay government center for Calinan Poblacion.',       icon:'🏛️' },
  { id:9,  name:'Calinan Fire Station',         cat:'fire',       lat:7.1900, lng:125.4545, desc:'BFP Station serving Calinan and nearby barangays.',       icon:'🚒' },
  { id:10, name:'Malagos Elementary School',    cat:'school',     lat:7.1760, lng:125.4320, desc:'Public elementary school in Malagos.',                    icon:'🏫' },
];

// ─── MAP INIT ─────────────────────────────────────────
const map = L.map('map').setView([7.1885, 125.4558], 14);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>'
}).addTo(map);

// ─── MARKER MANAGEMENT ────────────────────────────────
let allPlaces = [];
let allMarkers = [];
let userMarker = null;
let userLatLng = null;
let routingControl = null;
let currentCat = 'all';

function categoryColor(cat) {
  const colors = {
    tourist:    '#2b6b45',
    hospital:   '#d9534f',
    school:     '#2b4d8c',
    restaurant: '#e07b39',
    police:     '#5a2b8c',
    government: '#8c6b2b',
    fire:       '#c0392b',
    default:    '#5aa77a'
  };
  return colors[cat] || colors.default;
}

function makeIcon(place) {
  return L.divIcon({
    className: '',
    html: `<div style="
      background:${categoryColor(place.cat)};
      color:white; font-size:18px;
      width:36px; height:36px;
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 3px 10px rgba(0,0,0,0.25);
      border:2px solid white;
    ">
      <span style="transform:rotate(45deg)">${place.icon || '📍'}</span>
    </div>`,
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -38]
  });
}

function renderMarkers(places) {
  allMarkers.forEach(m => map.removeLayer(m));
  allMarkers = [];

  places.forEach(place => {
    const marker = L.marker([place.lat, place.lng], { icon: makeIcon(place) })
      .addTo(map)
      .bindPopup(`
        <div class="popup-content">
          <h4>${place.icon || ''} ${place.name}</h4>
          <p>${place.desc || ''}</p>
          <button onclick="routeTo(${place.lat},${place.lng},'${place.name.replace(/'/g,"\\'")}')">
            🧭 Get Directions
          </button>
        </div>
      `);
    allMarkers.push(marker);
  });
}

async function loadPlaces() {
  try {
    // Try Flask API first
    const res = await fetch(`${API}/search?q=`, { signal: AbortSignal.timeout(3000) });
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) {
      // Map Flask data to our format (adjust fields to match your schema)
      allPlaces = data.map((d, i) => ({
        id: i,
        name: d.name || 'Unknown',
        cat: d.category || d.type || 'tourist',
        lat: parseFloat(d.lat || d.latitude) || 7.1885,
        lng: parseFloat(d.lng || d.longitude) || 125.4558,
        desc: d.description || '',
        icon: d.icon || '📍'
      })).filter(p => p.lat && p.lng);
    }
  } catch(e) {
    // Flask offline — use static data
    console.warn('Flask offline, using static place data.');
  }

  if (allPlaces.length === 0) allPlaces = STATIC_PLACES;

  renderMarkers(allPlaces);
  populateRouteSelect(allPlaces);
  updateNearbyList();
}

function filterCat(btn, cat) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = cat;
  const filtered = cat === 'all' ? allPlaces : allPlaces.filter(p => p.cat === cat || p.cat === cat.replace(' ', ''));
  renderMarkers(filtered);
}

// ─── GPS ──────────────────────────────────────────────
function initGPS() {
  if (!navigator.geolocation) {
    setGPSStatus('denied', 'GPS not supported');
    return;
  }

  navigator.geolocation.watchPosition(
    pos => {
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      userLatLng = [lat, lng];

      document.getElementById('lat').textContent = lat.toFixed(6);
      document.getElementById('lng').textContent = lng.toFixed(6);
      document.getElementById('acc').textContent = `±${Math.round(accuracy)} m`;
      setGPSStatus('ok', 'GPS Active');

      const userIcon = L.divIcon({
        className: '',
        html: `<div style="
          width:18px; height:18px; border-radius:50%;
          background:#2b6b45; border:3px solid white;
          box-shadow:0 0 0 4px rgba(43,107,69,0.3);
        "></div>`,
        iconSize: [18, 18], iconAnchor: [9, 9]
      });

      if (userMarker) {
        userMarker.setLatLng([lat, lng]);
      } else {
        userMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 1000 })
          .addTo(map)
          .bindPopup('<b>You are here</b>');
        map.setView([lat, lng], 15);
      }

      updateNearbyList();
    },
    err => {
      setGPSStatus('denied', 'Location denied');
    },
    { enableHighAccuracy: true, maximumAge: 5000 }
  );
}

function setGPSStatus(cls, text) {
  const el = document.getElementById('gps-status');
  el.className = `gps-status ${cls}`;
  el.textContent = text;
}

function recenterMap() {
  if (userLatLng) {
    map.setView(userLatLng, 16);
    showToast('Re-centered to your location');
  } else {
    showToast('GPS location not available yet');
  }
}

// ─── NEARBY ───────────────────────────────────────────
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateNearbyList() {
  const list = document.getElementById('nearbyList');
  const base = userLatLng || [7.1885, 125.4558];

  const sorted = [...allPlaces]
    .map(p => ({ ...p, dist: haversine(base[0], base[1], p.lat, p.lng) }))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, 6);

  list.innerHTML = sorted.map(p => `
    <li onclick="flyTo(${p.lat},${p.lng},'${p.name.replace(/'/g,"\\'")}')">
      <span class="nearby-dot" style="background:${categoryColor(p.cat)}"></span>
      <span>
        <b>${p.name}</b><br>
        <span style="font-size:12px;color:var(--text-muted)">${p.icon} ${p.cat} · ${p.dist < 1 ? (p.dist*1000).toFixed(0)+'m' : p.dist.toFixed(1)+'km'}</span>
      </span>
    </li>
  `).join('');
}

function flyTo(lat, lng, name) {
  map.flyTo([lat, lng], 16, { duration: 1.2 });
  allMarkers.forEach(m => {
    if (m.getLatLng().lat.toFixed(4) === parseFloat(lat).toFixed(4)) m.openPopup();
  });
}

// ─── ROUTING ──────────────────────────────────────────
function populateRouteSelect(places) {
  const sel = document.getElementById('routeSelect');
  sel.innerHTML = '<option value="">— Choose a destination —</option>';
  places.forEach(p => {
    const opt = document.createElement('option');
    opt.value = `${p.lat},${p.lng}`;
    opt.textContent = `${p.icon} ${p.name}`;
    sel.appendChild(opt);
  });
}

function getDirections() {
  const sel = document.getElementById('routeSelect');
  if (!sel.value) { showToast('Please choose a destination first'); return; }
  if (!userLatLng) { showToast('Waiting for your GPS location…'); return; }

  const [destLat, destLng] = sel.value.split(',').map(Number);
  routeTo(destLat, destLng, sel.options[sel.selectedIndex].textContent);
}

function routeTo(destLat, destLng, name) {
  if (!userLatLng) { showToast('GPS location needed for routing'); return; }
  clearRoute();

  routingControl = L.Routing.control({
    waypoints: [
      L.latLng(userLatLng[0], userLatLng[1]),
      L.latLng(destLat, destLng)
    ],
    routeWhileDragging: false,
    show: true,
    lineOptions: { styles: [{ color: '#2b6b45', weight: 5, opacity: 0.85 }] },
    createMarker: () => null // use our own markers
  }).addTo(map);

  showToast(`Routing to ${name}…`);
}

function clearRoute() {
  if (routingControl) { map.removeControl(routingControl); routingControl = null; }
}

// ─── EMERGENCY ────────────────────────────────────────
function findNearest(type) {
  const cats = { hospital: 'hospital', police: 'police', fire: 'fire' };
  const cat = cats[type];
  const base = userLatLng || [7.1885, 125.4558];

  const candidates = allPlaces
    .filter(p => p.cat === cat || p.cat === type)
    .map(p => ({ ...p, dist: haversine(base[0], base[1], p.lat, p.lng) }))
    .sort((a, b) => a.dist - b.dist);

  if (candidates.length === 0) { showToast(`No ${type} found in directory`); return; }

  const nearest = candidates[0];
  map.flyTo([nearest.lat, nearest.lng], 16, { duration: 1.2 });

  const typeLabel = { hospital:'Hospital', police:'Police Station', fire:'Fire Station' }[type];
  showToast(`Nearest ${typeLabel}: ${nearest.name} (${nearest.dist < 1 ? (nearest.dist*1000).toFixed(0)+'m' : nearest.dist.toFixed(1)+'km'})`);

  if (userLatLng) routeTo(nearest.lat, nearest.lng, nearest.name);
}

// ─── SEARCH ───────────────────────────────────────────
let searchTimer = null;
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { searchResults.style.display = 'none'; return; }
  searchTimer = setTimeout(() => liveSearch(q), 300);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
  if (e.key === 'Escape') searchResults.style.display = 'none';
});

document.addEventListener('click', e => {
  if (!e.target.closest('#searchWrap')) searchResults.style.display = 'none';
});

async function liveSearch(q) {
  searchResults.style.display = 'block';
  searchResults.innerHTML = '<div class="sr-loading">Searching…</div>';

  let results = [];

  try {
    const res = await fetch(`${API}/search?q=${encodeURIComponent(q)}`, { signal: AbortSignal.timeout(3000) });
    const data = await res.json();
    if (Array.isArray(data)) results = data.slice(0, 8);
  } catch(e) {
    // Fall back to local filter
    results = allPlaces.filter(p =>
      p.name.toLowerCase().includes(q.toLowerCase()) ||
      (p.desc && p.desc.toLowerCase().includes(q.toLowerCase()))
    ).slice(0, 8);
  }

  if (results.length === 0) {
    searchResults.innerHTML = '<div class="sr-loading">No results found for "' + q + '"</div>';
    return;
  }

  searchResults.innerHTML = results.map(r => {
    const name = r.name || 'Unknown';
    const desc = r.description || r.desc || '';
    const icon = r.icon || '📍';
    const lat  = r.lat || r.latitude;
    const lng  = r.lng || r.longitude;
    return `
      <div class="sr-item" onclick="selectResult(${lat},${lng},'${name.replace(/'/g,"\\'")}')">
        <span class="sr-icon">${icon}</span>
        <div>
          <div class="sr-name">${name}</div>
          ${desc ? `<div class="sr-desc">${desc.substring(0,80)}…</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function selectResult(lat, lng, name) {
  searchResults.style.display = 'none';
  searchInput.value = name;
  map.flyTo([lat, lng], 16, { duration: 1.2 });
  showToast(`Showing: ${name}`);
}

function doSearch() {
  const q = searchInput.value.trim();
  if (!q) return;
  liveSearch(q);
}

// ─── TOAST ────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── BOOT ─────────────────────────────────────────────
loadPlaces();
initGPS();
</script>
