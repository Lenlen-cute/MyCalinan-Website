<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | MyCalinan</title>
    <link rel="stylesheet" href="style/Admin-login.css">
    <link rel="icon" type="image/png" href="image/CALINAN LOGO.png">
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <div class="logo-section">
                <img src="image/CALINAN LOGO.png" alt="Logo">
                <h1>MyCalinan</h1>
                <p>Administrator Portal</p>
            </div>

            <form class="login-form" id="admin-login-form">
                <h2>Admin Login</h2>

                <div id="login-error" class="login-error" style="display:none;"></div>

                <div class="input-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password">
                            Show
                        </button>
                    </div>
                </div>

                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember Me</label>
                </div>

                <button type="submit" class="login-btn" id="login-submit-btn">
                    Sign In
                </button>

                <div class="footer-text">
                    Authorized Administrators Only
                </div>

                <div class="home-link">
                    <a href="HomePage.html" class="home-btn">Back to MyCalinan</a>
                </div>

            </form>

        </div>
    </div>

    <!-- Link to compiled JavaScript -->
    <script src="js/admin-login.js" defer></script>
</body>
</html>
