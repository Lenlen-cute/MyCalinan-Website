<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements | MyCalinan</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#f4f7f9;
    color:#333;
}

header{
    background:#1a5c38;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:2rem;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

.announcement-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-content{
    padding:18px;
}

.category{
    display:inline-block;
    padding:4px 12px;
    border-radius:20px;
    font-size:.75rem;
    font-weight:600;
    background:#e8f5ee;
    color:#1a5c38;
    margin-bottom:10px;
}

.title{
    font-size:1.1rem;
    font-weight:700;
    margin-bottom:8px;
}

.date{
    font-size:.85rem;
    color:#777;
    margin-bottom:12px;
}

.description{
    color:#555;
    line-height:1.5;
}

.loading,
.empty{
    text-align:center;
    padding:60px;
    color:#777;
    font-size:1rem;
}
header{
    background:#1a5c38;
    color:white;
    padding:20px;
    text-align:center;
    position:relative;
}

.back-btn{
    position:absolute;
    left:20px;
    top:20px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.15);
    padding:10px 16px;
    border-radius:8px;
    transition:.2s;
    font-size:.9rem;
}

.back-btn:hover{
    background:rgba(255,255,255,.25);
}
</style>
</head>
<body>

<header>
    <a href="HomePage.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <h1>
        <i class="fas fa-bullhorn"></i>
        Community Announcements
    </h1>
</header>

<div class="container">

    <div id="announcementContainer">
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            Loading announcements...
        </div>
    </div>

</div>

<script>

const API_URL = "http://localhost:5000/api/announcements";

function escapeHtml(text){
    if(text == null) return "";
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

async function loadAnnouncements(){

    const container = document.getElementById("announcementContainer");

    try{

        const response = await fetch(API_URL);

        if(!response.ok){
            throw new Error("Server error");
        }

        const announcements = await response.json();

        if(!announcements.length){
            container.innerHTML = `
                <div class="empty">
                    No announcements available.
                </div>
            `;
            return;
        }

        let html = `<div class="announcement-grid">`;

        announcements.forEach(item => {

            html += `
                <div class="card">

                    ${
                        item.image
                        ? `<img src="${item.image}" alt="${escapeHtml(item.title)}">`
                        : ""
                    }

                    <div class="card-content">

                        <span class="category">
                            ${escapeHtml(item.category || "General")}
                        </span>

                        <div class="title">
                            ${escapeHtml(item.title)}
                        </div>

                        <div class="date">
                            <i class="fas fa-calendar"></i>
                            ${escapeHtml(item.date || "No date")}
                        </div>

                        <div class="description">
                            ${escapeHtml(item.description)}
                        </div>

                    </div>
                </div>
            `;
        });

        html += `</div>`;

        container.innerHTML = html;

    }catch(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                ⚠ Unable to load announcements.<br>
                Make sure Flask is running on port 5000.
            </div>
        `;
    }
}

loadAnnouncements();

setInterval(loadAnnouncements, 30000);

</script>

</body>
</html>
