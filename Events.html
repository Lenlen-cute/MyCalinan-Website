<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Events & Festivals | MyCalinan</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#f4f7f9;
    color:#333;
}

header{
    background:#1a5c38;
    color:#fff;
    text-align:center;
    padding:25px;
}

header h1{
    font-size:2rem;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.stat-card i{
    color:#1a5c38;
    font-size:1.4rem;
    margin-bottom:8px;
}

.stat-card h2{
    color:#1a5c38;
    margin-bottom:4px;
}

.events-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:18px;
}

.badge{
    display:inline-block;
    padding:5px 12px;
    border-radius:20px;
    font-size:.75rem;
    font-weight:600;
    margin-bottom:12px;
}

.badge.event{
    background:#e3f0ff;
    color:#1a56a0;
}

.badge.festival{
    background:#fde8f5;
    color:#8b1a6b;
}

.badge.program{
    background:#d4edda;
    color:#155724;
}

.badge.advisory{
    background:#fff3cd;
    color:#856404;
}

.badge.general{
    background:#e8f5ee;
    color:#1a5c38;
}

.title{
    font-size:1.15rem;
    font-weight:700;
    margin-bottom:10px;
}

.meta{
    color:#666;
    font-size:.9rem;
    margin-bottom:10px;
}

.meta i{
    width:18px;
    color:#1a5c38;
}

.description{
    line-height:1.6;
    color:#555;
}

.loading,
.empty{
    text-align:center;
    padding:60px;
    color:#777;
}
.back-btn{
    position:absolute;
    left:20px;
    top:20px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.15);
    padding:10px 16px;
    border-radius:8px;
    transition:.2s;
    font-size:.9rem;
}

.back-btn:hover{
    background:rgba(255,255,255,.25);
}
</style>
</head>

<body>

<header>

    <a href="HomePage.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        Back to Home
    </a>

    <h1>
        <i class="fas fa-calendar-alt"></i>
        Events & Festivals
    </h1>

</header>

<div class="container">

    <div class="stats">

        <div class="stat-card">
            <i class="fas fa-calendar-alt"></i>
            <h2 id="totalEvents">0</h2>
            <p>Total Listings</p>
        </div>

        <div class="stat-card">
            <i class="fas fa-calendar-day"></i>
            <h2 id="eventCount">0</h2>
            <p>Events</p>
        </div>

        <div class="stat-card">
            <i class="fas fa-mask"></i>
            <h2 id="festivalCount">0</h2>
            <p>Festivals</p>
        </div>

        <div class="stat-card">
            <i class="fas fa-exclamation-circle"></i>
            <h2 id="advisoryCount">0</h2>
            <p>Advisories</p>
        </div>

    </div>

    <div id="eventsContainer">

        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            Loading events...
        </div>

    </div>

</div>

</body>
</html>
